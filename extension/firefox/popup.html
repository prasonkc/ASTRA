<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ASTRA</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 300px;
        margin: 0;
        padding: 16px;
        background: #16181d;
        color: #e6e6e6;
      }
      #integrate {
        display: block;
        width: 100%;
        padding: 22px 16px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        color: #0c1013;
        background: #6fd3ff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.05s ease;
      }
      #integrate:hover {
        background: #8adcff;
      }
      #integrate:active {
        transform: scale(0.99);
      }
      #integrate.on {
        color: #e6e6e6;
        background: #232733;
        border: 1px solid #3ddc84;
      }
      #integrate.on:hover {
        background: #2b3140;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        color: #8a93a3;
        text-align: center;
        min-height: 14px;
      }
      #status.ok {
        color: #7ee787;
      }
      #status.err {
        color: #ff7b72;
      }
      #endpoint {
        margin-top: 4px;
        font-size: 10px;
        color: #5b6472;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <button id="integrate" type="button">Integrate ASTRA with webpages</button>
    <div id="status"></div>
    <div id="endpoint"></div>

    <script src="popup.js"></script>
  </body>
</html>
